<svg width="128" height="128" viewBox="15 17 99 99" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Mr Penguin favicon. His 128-box artwork had the penguin filling only 76%
     of the width and 66% of the height, so in a tab it rendered as a dot —
     the viewBox is retightened to the art's real bounds (x 16-113, y 24-109)
     so it fills the icon edge to edge. Geometry is otherwise untouched.
     The headphone chrome carries a mid slate as its ATTRIBUTE value because
     his #E0E0E0 silver is invisible on light tab bars (Chrome light is
     #dee1e6); the media query restores the true silver on dark ones. -->
<style>
  @media (prefers-color-scheme: dark) { .chrome { fill: #E0E0E0 } }
</style>
